baseURL: "https://blog.henrikhao.com/"
locale: "en-AU"
title: "Rik'Log"
theme: "PaperMod"
timeZone: "Australia/Melbourne"

enableEmoji: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

pagination:
  pagerSize: 10

permalinks:
  posts: "/posts/:slug/"

taxonomies:
  tag: tags
  series: series

outputs:
  home:
    - HTML
    - RSS
    - JSON

menu:
  main:
    - identifier: posts
      name: Posts
      url: /
      weight: 10
    - identifier: archives
      name: Archive
      url: /archives/
      weight: 20
    - identifier: search
      name: Search
      url: /search/
      weight: 30
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 40
    - identifier: about
      name: About
      url: /about/
      weight: 50

params:
  env: production
  title: "Rik'Log"
  description: "Notes on robot learning, written down so they are not forgotten. The palest ink is better than the best memory."
  author: "Henrik Hao"
  DateFormat: "2 January 2006"
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: true
  ShareButtons:
    - x
    - linkedin
    - reddit
    - facebook
    - whatsapp
    - telegram
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true

  homeInfoParams:
    Title: "👋 Welcome to Rik'Log"
    Content: |
      *The palest ink is better than the best memory.*

      Hi, this is Henrik. I write down what I learn about robot learning here, so that I can still find it later.

  socialIcons:
    - name: github
      url: https://github.com/HenrikHao
    - name: linkedin
      url: https://www.linkedin.com/in/henrik-hao/
    - name: rss
      url: /index.xml

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys:
      - title
      - permalink
      - summary
      - content

minify:
  disableXML: true
  minifyOutput: true

markup:
  highlight:
    noClasses: false
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - - '$$'
              - '$$'
          inline:
            - - '\('
              - '\)'
